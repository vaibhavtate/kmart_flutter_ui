name: kmart_flutter_ui
description: K Mart Flutter UI project
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true


  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/fonts/
